services:
  postgres:
    image: postgres:18.6
    command: postgres -c 'max_connections=20'
    user: postgres:postgres
    restart: unless-stopped
    read_only: true
    networks:
      - db
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_passwd
      POSTGRES_USER: ${POSTGRES_USER}
    secrets:
      - db_passwd
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 50
        reservations:
          memory: 256M
    tmpfs:
      - /tmp:uid=999,gid=999
      - /run/postgresql:uid=999,gid=999
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: 50M
        max-file: "3"

secrets:
  db_passwd:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:

networks:
  db:
    driver: bridge
    internal: true

