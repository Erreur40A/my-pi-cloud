spring.application.name=server
spring.config.import=optional:file:../.env[.properties],optional:configtree:/run/secrets/
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=cloud_app
spring.datasource.password=${DB_APP_PASSWORD:${db_app_password}}
spring.flyway.user=cloud_owner
spring.flyway.password=${DB_OWNER_PASSWORD:${db_owner_password}}
spring.flyway.schemas=cloud
spring.jpa.hibernate.ddl-auto=validate

